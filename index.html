<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>📄 Paper Package & Cost Calculator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
<style>
body { font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg,#d9f1ff,#f3f3f3); padding: 12px; }
.container { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.12); }
.main-title { font-weight: 800; font-size: 1.7rem; text-align: center; color: #0d6efd; margin-bottom: 25px; }
.main-title i { color: rgba(255,127,80,0.5); margin-right: 8px; }
.book-card { border: none; border-radius: 12px; padding: 15px; margin-bottom: 15px; background: linear-gradient(145deg,#ffffff,#e0f7ff); box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: 0.2s; }
.book-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
.book-card label { font-weight: 600; color: #495057; }
.book-card label i { color: rgba(13,110,253,0.3); margin-right: 4px; } /* light blue, low opacity for symbols */
.summary-card { border-radius: 12px; padding: 16px; background: #77BEF0; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s; text-align: center; }
.summary-card i { color:#065084; } /* lighter icon inside summary card */
.summary-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
.summary-card .value { font-weight: 700; font-size: 1.2rem; margin-top: 6px; }
.table-primary th { background: #8ed2ff; color: #fff; }
.table-warning th { background: #8ed2ff; color: #fff; }
@media print { .no-print, button { display: none !important; } }
</style>

</head>
<body>
<div class="container">
  <div class="main-title"><i class="fa-solid fa-book"></i>Paper Package & Cost Calculator</div>

  <div class="mb-4">
    <label class="form-label fw-bold"><i class="fa-solid fa-list-ol"></i> Number of Books:</label>
    <input id="numBooks" class="form-control" type="number" min="1" placeholder="Enter number of books"/>
  </div>

  <div id="bookTableContainer"></div>

  <div id="resultArea" style="display:none;">
    <h5 class="mt-4"><i class="fa-solid fa-chart-column"></i> Calculation Result</h5>
    <div class="table-responsive mb-3">
      <table class="table table-sm table-bordered">
        <thead class="table-primary">
          <tr><th>#</th><th>Paper + Material</th><th>Total Sheets</th><th>Quantity</th><th>Binding</th><th>Price / Book</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>

<h5 class="mt-3 text-warning"><i class="fa-solid fa-box-open"></i> Paper Packs Needed</h5>
<div class="table-responsive mb-3">
  <table class="table table-sm table-bordered">
    <thead class="table-warning"><tr><th>Paper Type</th><th>Total Sheets</th><th>Packs Needed</th></tr></thead>
    <tbody id="packBody"></tbody>
  </table>
</div>

<div id="summaryBox" class="mt-4">
  <h5 class="fw-bold"><i class="fa-solid fa-star"></i> Summary</h5>
  <div class="row g-3" id="summaryCards"></div>
</div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
const TONER_COST_PER_SHEET = 962/90000, INSIDE_COST_A4 = 31/4000, INSIDE_COST_A3 = 31/2000;
const COVER_COST = 18/400, LAM_COST = 8/400, BINDING_COST = 150/10000, STAPLE_COST = (17/20/1000)*2;
const BASE_WF=500, BASE_MT=250, BASE_A3=500, CUT_A4=8, CUT_A3=4;
const PACK_WF_A4 = BASE_WF*CUT_A4, PACK_MT_A4 = BASE_MT*CUT_A4, PACK_A3=BASE_A3*CUT_A3, COVER_PACK=400;
function fmtInt(n){return Number(n).toLocaleString();}
function fmtPrice(n){return "$"+Number(n).toFixed(2);}

function createBookTable(){
  const n = parseInt($("#numBooks").val());
  if(!n || n<1){ $("#bookTableContainer").html(""); $("#resultArea").hide(); return; }
  let html = "";
  for(let i=1;i<=n;i++){
    html += `<div class="book-card row g-2">
      <div class="col-12 col-md-1"><label>#${i}</label></div>
      <div class="col-12 col-md-2"><label><i class="fa-solid fa-file-lines"></i> Pages</label><input type="number" id="pages${i}" class="form-control" min="1"/></div>
      <div class="col-12 col-md-2"><label><i class="fa-solid fa-hashtag"></i> Qty</label><input type="number" id="qty${i}" class="form-control" min="1"/></div>
      <div class="col-12 col-md-2"><label><i class="fa-solid fa-sheet-plastic"></i> Paper</label><select id="paper${i}" class="form-select"><option value="A4">A4</option><option value="A3">A3</option></select></div>
      <div class="col-12 col-md-2"><label><i class="fa-solid fa-cubes"></i> Material</label><select id="material${i}" class="form-select"><option value="WF">WF</option><option value="MT">MT</option></select></div>
      <div class="col-12 col-md-2"><label><i class="fa-solid fa-book-open"></i> Binding</label><select id="binding${i}" class="form-select"><option value="Perfect">Perfect</option><option value="Staple">Staple</option></select></div>
        </div>`;
  }
  $("#bookTableContainer").html(html);
  $("input, select").on("input change", updateCalculation);
}

function updateCalculation(){
  const n=parseInt($("#numBooks").val());
  if(!n||n<1){ $("#resultArea").hide(); return; }
  $("#resultBody,#packBody,#summaryCards").html("");
  let totalBooksQty=0, totalCoverSheets=0, totalCost=0;
  let totalSheetsWF=0, totalSheetsMT=0, totalSheetsA3=0;

  for(let i=1;i<=n;i++){
    const pages=parseInt($("#pages"+i).val())||0;
    const qty=parseInt($("#qty"+i).val())||0;
    const paper=$("#paper"+i).val(), material=$("#material"+i).val(), binding=$("#binding"+i).val();
    if(pages<=0||qty<=0) continue;
    const sheetsPerBook=Math.ceil(pages/2), totalSheetsForLines=sheetsPerBook*qty;
    const tonerSheets = paper==="A4"?sheetsPerBook+4:sheetsPerBook*2+4;
    const tonerCost=tonerSheets*TONER_COST_PER_SHEET;
    const insideCost=paper==="A4"?sheetsPerBook*INSIDE_COST_A4:sheetsPerBook*INSIDE_COST_A3;
    const pricePerBook=tonerCost+insideCost+COVER_COST+LAM_COST+(binding==="Perfect"?BINDING_COST:STAPLE_COST);

    totalBooksQty+=qty; totalCoverSheets+=qty; totalCost+=pricePerBook*qty;
    if(paper==="A4" && material==="WF") totalSheetsWF+=totalSheetsForLines;
    if(paper==="A4" && material==="MT") totalSheetsMT+=totalSheetsForLines;
    if(paper==="A3") totalSheetsA3+=totalSheetsForLines;

    $("#resultBody").append(`<tr>
      <td>${i}</td><td>${paper}-${material}</td><td>${fmtInt(totalSheetsForLines)}</td>
      <td>${fmtInt(qty)}</td><td>${binding}</td><td>${fmtPrice(pricePerBook)}</td>
    </tr>`);
  }

  const packsWF=totalSheetsWF>0?Math.ceil(totalSheetsWF/PACK_WF_A4):0;
  const packsMT=totalSheetsMT>0?Math.ceil(totalSheetsMT/PACK_MT_A4):0;
  const packsA3=totalSheetsA3>0?Math.ceil(totalSheetsA3/PACK_A3):0;
  const coverPacks=totalCoverSheets>0?Math.ceil(totalCoverSheets/COVER_PACK):0;

  if(totalSheetsWF>0) {}$("#packBody").append(`<tr><td>A4-WF</td><td>${fmtInt(totalSheetsWF)}</td><td>${fmtInt(packsWF)}</td></tr>`);
  if(totalSheetsMT>0) $("#packBody").append(`<tr><td>A4-MT</td><td>${fmtInt(totalSheetsMT)}</td><td>${fmtInt(packsMT)}</td></tr>`);
  if(totalSheetsA3>0) $("#packBody").append(`<tr><td>A3-WF</td><td>${fmtInt(totalSheetsA3)}</td><td>${fmtInt(packsA3)}</td></tr>`);
  if(totalCoverSheets>0) $("#packBody").append(`<tr><td>Cover GL</td><td>${fmtInt(totalCoverSheets)}</td><td>${fmtInt(coverPacks)}</td></tr>`);

  const cards = [
    {title:"Total Books", icon:"fa-solid fa-book", value:fmtInt(totalBooksQty)},
    // {title:"Total Cover Sheets", icon:"fa-solid fa-file", value:fmtInt(totalCoverSheets)},
    {title:"Total Cost ($)", icon:"fa-solid fa-dollar-sign", value:fmtPrice(totalCost)},
    {title:"GL Packs (Cover)", icon:"fa-solid fa-box", value:fmtInt(coverPacks)}
  ];
  if(packsWF>0) cards.push({title:"A4 WF Packs", icon:"fa-solid fa-cubes", value:fmtInt(packsWF)});
  if(packsMT>0) cards.push({title:"A4 MT Packs", icon:"fa-solid fa-cubes-stacked", value:fmtInt(packsMT)});
  if(packsA3>0) cards.push({title:"A3 WF Packs", icon:"fa-solid fa-boxes-stacked", value:fmtInt(packsA3)});

  $("#summaryCards").html("");
  cards.forEach(c=>{
    const col=$('<div class="col-6 col-md-3"></div>');
    const card=$(`<div class="summary-card text-center"><i class="${c.icon} fa-2x mb-2"></i><div class="fw-bold">${c.title}</div><div class="value">${c.value}</div></div>`);
    col.append(card); $("#summaryCards").append(col);
  });

  $("#resultArea").show();
}

$(document).ready(function(){ $("#numBooks").on("input", createBookTable); });
</script>

</body>
</html>
