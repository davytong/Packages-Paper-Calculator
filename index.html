<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=0.8, maximum-scale=1, user-scalable=no"
    />
    <title>📄 Paper Package & Cost Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #eef2f6;
        font-family: "Segoe UI", sans-serif;
        padding: 5px;
      }
      .container {
        background: #fff;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #0d47a1;
        text-align: center;
        margin-bottom: 15px;
        font-size: 1.2rem;
      }
      table th,
      table td {
        font-size: 0.75rem;
        text-align: center;
        vertical-align: middle;
        padding: 2px;
      }
      input,
      select {
        font-size: 0.7rem;
        padding: 1px;
      }
      @media (max-width: 576px) {
        h2 {
          font-size: 1rem;
        }
        table th,
        table td {
          font-size: 0.7rem;
          padding: 1px;
        }
        input,
        select {
          font-size: 0.65rem;
          padding: 1px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>📄 Paper Package & Cost Calculator</h2>

      <div class="mb-2 row">
        <label class="col-5 col-form-label">Number of Books:</label>
        <div class="col-7">
          <input
            type="number"
            class="form-control form-control-sm"
            id="numBooks"
            min="1"
            oninput="createBookTable()"
          />
        </div>
      </div>

      <div id="bookTableContainer" class="table-responsive"></div>

      <div id="resultTable" class="table-responsive mt-2" style="display: none">
        <h5>📊 Calculation Result</h5>
        <table class="table table-bordered table-striped table-hover table-sm">
          <thead class="table-primary">
            <tr>
              <th>Book #</th>
              <th>Paper + Material</th>
              <th>Sheets</th>
              <th>Binding</th>
              <th>Price per Book ($)</th>
              <th>Total Packages</th>
              <th>Est. Days</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const TonerCostPerSheet = 962 / 90000;
      const InsideBookCostA4 = 31 / 4000;
      const InsideBookCostA3 = 31 / 2000;
      const CoverCost = 18 / 400;
      const LaminateCost = 8 / 400;
      const BindingCost = 150 / 10000;
      const StapleCost = (17 / 20 / 1000) * 2;
      const PrintingCapacityA4 = 30000; // sheets/day

      function formatNumber(num) {
        return num.toFixed(2);
      }

      function createBookTable() {
        const num = parseInt($("#numBooks").val());
        const container = $("#bookTableContainer");
        container.empty();
        if (isNaN(num) || num <= 0) return;

        let html = `<table class="table table-bordered table-hover table-striped table-sm">
    <thead class="table-secondary"><tr>
      <th>Book #</th><th>Pages</th><th>Qty</th><th>Paper</th><th>Material</th><th>Binding</th>
    </tr></thead><tbody>`;

        for (let i = 1; i <= num; i++) {
          html += `<tr>
      <td>${i}</td>
      <td><input type="number" class="form-control form-control-sm" id="pages${i}" oninput="updateCalculation()"></td>
      <td><input type="number" class="form-control form-control-sm" id="qty${i}" oninput="updateCalculation()"></td>
      <td><select class="form-select form-select-sm" id="paper${i}" onchange="updateCalculation()">
          <option value="A3">A3</option><option value="A4">A4</option></select></td>
      <td><select class="form-select form-select-sm" id="material${i}" onchange="updateCalculation()">
          <option value="WF">WF</option><option value="MT">MT</option></select></td>
      <td><select class="form-select form-select-sm" id="binding${i}" onchange="updateCalculation()">
          <option value="Perfect">Perfect</option><option value="Staple">Staple</option></select></td>
    </tr>`;
        }
        html += `</tbody></table>`;
        container.html(html);
      }

      function updateCalculation() {
        const numBooks = parseInt($("#numBooks").val());
        const resultBody = $("#resultBody");
        const resultTable = $("#resultTable");
        resultBody.empty();
        if (isNaN(numBooks) || numBooks <= 0) return;

        for (let i = 1; i <= numBooks; i++) {
          const pages = parseInt($("#pages" + i).val() || 0);
          const qty = parseInt($("#qty" + i).val() || 0);
          const paper = $("#paper" + i).val();
          const material = $("#material" + i).val();
          const binding = $("#binding" + i).val();
          if (pages <= 0 || qty <= 0) continue;

          const sheets = Math.ceil(pages / 2); // inside
          const coverSheetsA4 = 4; // 2 A3 = 4 A4
          const totalSheetsA4 =
            paper === "A4"
              ? sheets + coverSheetsA4
              : sheets * 2 + coverSheetsA4;

          const tonerCost = totalSheetsA4 * TonerCostPerSheet;
          const insideCost =
            paper === "A4"
              ? sheets * InsideBookCostA4
              : sheets * InsideBookCostA3;
          const coverLaminate = CoverCost + LaminateCost;
          const bindCost = binding === "Perfect" ? BindingCost : StapleCost;
          const pricePerBook =
            tonerCost + insideCost + coverLaminate + bindCost;

          let sheetsPerPack = paper === "A4" ? 4000 : 2000;
          const totalPacks = Math.ceil((totalSheetsA4 * qty) / sheetsPerPack);

          const estDays = Math.ceil((totalSheetsA4 * qty) / PrintingCapacityA4);

          resultBody.append(`<tr>
      <td>${i}</td>
      <td>${paper} - ${material}</td>
      <td>${sheets}</td>
      <td>${binding}</td>
      <td>${formatNumber(pricePerBook)}</td>
      <td>${totalPacks}</td>
      <td>${estDays}</td>
    </tr>`);
        }
        resultTable.show();
      }
    </script>
  </body>
</html>
